# Auto-ML 예시 설정
# - 운영 시에는 본 파일을 복사한 뒤 데이터 경로 / features / search_space 만 바꿔 사용한다.
# - 모든 키는 auto_ml/config.py 의 dataclass 와 1:1 대응한다.

# ==== 데이터 ====================================================
# 학습 / 평가 데이터를 별도 Parquet 파일로 받는다.
train_data_path: ./data/train.parquet
test_data_path: ./data/test.parquet
target_column: target

# 학습/스코어링에 사용할 컬럼 정의 CSV 경로.
# CSV 컬럼: name, type(continuous|category), used(true|false)
# used == true 인 행만 실제 feature 로 사용된다.
features_csv: ./configs/features.csv

# 결과(스코어링 출력) 에 식별자로 보존할 컬럼 — 학습/예측에는 사용되지 않음
id_columns:
  - user_id

# ==== 산출물 저장 위치 ===========================================
artifact_dir: ./artifacts/models

# ==== 전처리: 1) 결측 → 2) 이상치 → 3) 스케일링 ===================
preprocessing:
  # 1) 결측 처리
  numeric_null_strategy: median             # median | mean | constant
  numeric_null_fill_value: 0.0
  categorical_null_strategy: most_frequent  # most_frequent | constant
  categorical_null_fill_value: MISSING

  # 2) 이상치 처리 (수치형, 백분위수 윈저라이징)
  outlier_method: percentile                # percentile | none
  outlier_lower_quantile: 0.01
  outlier_upper_quantile: 0.99
  outlier_action: clip                      # clip | null_then_impute

  # 2.5) Skew 변환 (수치형, |skew| > threshold 인 컬럼만 자동 선택)
  skew_method: signed_log1p                 # signed_log1p | quantile_normal | none
  skew_threshold: 1.0

  # 3) 스케일링 (수치형)
  scaling_method: standard                  # standard | minmax | robust | none

# ==== 변수 선택 (Stability Selection, Meinshausen & Bühlmann 2010) ====
# 전처리 직후, 모델 학습 직전 단계. enabled=false 면 통째로 건너뛴다.
feature_selection:
  enabled: false                            # opt-in. 운영 안정화를 위해 기본 false.
  base_estimator: lasso                     # lasso (L1 logistic) | lgbm (gain top-K)
  n_subsamples: 200                         # 부분표본 추출 횟수 (보통 100~500)
  subsample_ratio: 0.5                      # 각 부분표본 크기 비율
  threshold: 0.6                            # 채택 임계값 (보통 0.6~0.8)
  random_state: 42
  min_selected: 1                           # 임계값 이상 변수가 부족할 때 fallback 최소 개수
  # lasso 전용
  lasso_C: 0.1                              # 규제 강도 (낮을수록 강함)
  # lgbm 전용
  lgbm_top_k: 30                            # 부분표본당 상위 K 개
  lgbm_n_estimators: 100
  lgbm_learning_rate: 0.1

# ==== 학습 ======================================================
training:
  cv_folds: 5
  random_state: 42
  early_stopping_rounds: 50
  primary_metric: roc_auc                   # roc_auc | pr_auc | f1 | accuracy | precision | recall | ks

# ==== 베이지안 하이퍼파라미터 최적화 (Optuna) ====================
tuning:
  enabled: true
  n_trials: 30                              # 모델당 시도 횟수
  timeout: null                             # 모델당 최대 탐색 시간(초). null = 제한 없음
  cv_folds: 3                               # 튜닝 단계 KFold (속도 위해 보통 더 작게)
  random_state: 42

# ==== 모델 (3개 동시 학습 후 best 선정) ===========================
# 각 모델은 fixed_params (고정) + search_space (탐색 범위) 으로 구성한다.
# search_space 가 비어 있으면 해당 모델은 튜닝을 생략하고 fixed_params 만 사용.
#
# 손실 함수 ('loss' 키, 모델별 독립):
#   logloss (기본) — 라이브러리 native (binary / binary:logistic / Logloss)
#   focal          — Focal Loss (Lin et al., 2017). 클래스 불균형 데이터에 유리.
#                    focal_gamma / focal_alpha 를 fixed_params 에 두어 조정 (기본 2.0 / 0.25)
#                    또는 search_space 에 넣어 탐색 가능.
#                    호환 가능한 eval_metric: 순위 기반 (auc, AUC) 만 안전.
models:
  lgbm:
    enabled: true
    fixed_params:
      objective: binary
      metric: auc
      verbose: -1
      n_estimators: 2000
    search_space:
      learning_rate:
        type: float
        low: 0.01
        high: 0.3
        log: true
      num_leaves:
        type: int
        low: 15
        high: 255
      feature_fraction:
        type: float
        low: 0.6
        high: 1.0
      bagging_fraction:
        type: float
        low: 0.6
        high: 1.0
      min_data_in_leaf:
        type: int
        low: 10
        high: 200
      # ---- 가중치 정규화 (과적합 완화) ----
      reg_alpha:                              # L1 — 가중치 sparse 화 → 변수 선택 효과
        type: float
        low: 1.0e-8
        high: 10.0
        log: true
      reg_lambda:                             # L2 — 가중치 크기 제약
        type: float
        low: 1.0e-8
        high: 10.0
        log: true
      # ---- 분할 보수성 ----
      min_gain_to_split:                      # 분할 이득이 본 값 미만이면 분할 중단
        type: float
        low: 0.0
        high: 0.5

  xgb:
    enabled: true
    # loss: focal                       # 데모로 Focal Loss 를 사용하려면 주석 해제
    # focal 사용 시 fixed_params 의 'objective' 키는 wrapper 가 callable 로 덮어쓰므로
    # 두어도 무시된다. focal_gamma / focal_alpha 는 fixed_params 또는 search_space 에
    # 둘 수 있다 (기본 2.0 / 0.25).
    fixed_params:
      objective: binary:logistic
      eval_metric: auc
      tree_method: hist
      n_estimators: 2000
      # focal_gamma: 2.0
      # focal_alpha: 0.25
    search_space:
      learning_rate:
        type: float
        low: 0.01
        high: 0.3
        log: true
      max_depth:
        type: int
        low: 3
        high: 10
      subsample:
        type: float
        low: 0.6
        high: 1.0
      colsample_bytree:
        type: float
        low: 0.6
        high: 1.0
      min_child_weight:
        type: float
        low: 1.0
        high: 20.0
      # ---- 가중치 정규화 (과적합 완화) ----
      reg_alpha:                              # L1 — 가중치 sparse 화
        type: float
        low: 1.0e-8
        high: 10.0
        log: true
      reg_lambda:                             # L2 — 가중치 크기 제약
        type: float
        low: 1.0e-8
        high: 10.0
        log: true
      # ---- 분할 보수성 (LGBM 의 min_gain_to_split 과 동일 개념) ----
      gamma:                                  # 분할이 본 값 이상의 이득을 줘야만 수행
        type: float
        low: 0.0
        high: 5.0
      # focal 하이퍼파라미터도 탐색 가능 (loss: focal 일 때만 의미 있음):
      # focal_gamma: { type: float, low: 0.5, high: 4.0 }
      # focal_alpha: { type: float, low: 0.1, high: 0.9 }

  catboost:
    enabled: true
    fixed_params:
      loss_function: Logloss
      eval_metric: AUC
      iterations: 2000
      verbose: false
      allow_writing_files: false
    search_space:
      learning_rate:
        type: float
        low: 0.01
        high: 0.3
        log: true
      depth:
        type: int
        low: 4
        high: 10
      # ---- 가중치 정규화 (CatBoost 는 L1 미지원 — L2 만 강화) ----
      l2_leaf_reg:                            # L2. log scale 로 더 강한 규제까지 시도
        type: float
        low: 1.0
        high: 100.0
        log: true
      # ---- 노이즈 주입 (정규화 효과) ----
      random_strength:                        # 분할점 선택 시 가우시안 노이즈 강도
        type: float
        low: 0.0
        high: 10.0
      bagging_temperature:                    # Bayesian bootstrap 온도 (행 부분표본 변형)
        type: float
        low: 0.0
        high: 1.0

# ==== 리포트 ====================================================
reporting:
  output_dir: ./artifacts/reports
  generate_html: true
  generate_pdf: true
  title: Auto-ML Binary Classification Report

# ==== 주기 스코어링 =============================================
scoring:
  input_path: ./data/score_input.parquet
  output_path: ./artifacts/scores/scores.parquet
  id_columns:
    - user_id
  threshold: 0.5

# ==== SHAP 해석 (auto-ml-explain) ================================
# 입력 Parquet 의 각 행에 대해 변수별 SHAP 기여도를 계산해 wide 포맷으로 저장.
# 출력 스키마: <id_columns> + shap_<feature>... + base_value + score
# (probability 도메인, base + sum(shap) == score 보장)
explain:
  input_path: ./data/score_input.parquet
  output_path: ./artifacts/explanations/shap.parquet
  id_columns:
    - user_id

# ==== 작업 로그 =================================================
# 실행마다 stage(train|score|explain) 별 별도 로그 파일이 ``log_dir`` 에 생성된다.
# 파일명: <stage>_<YYYYMMDD>_<HHMMSS>.log
logging:
  log_dir: ./artifacts/logs
  level: INFO                               # DEBUG | INFO | WARNING | ERROR
  to_stdout: true
  to_file: true
