# 타이타닉 데이터 (이진분류: survived) 학습/스코어링 설정.
# - python examples/titanic/prepare_data.py 로 데이터 생성 후 실행
# - 테스트 시간 단축을 위해 cv_folds / n_trials 를 example.yaml 보다 작게 잡았다.

# ==== 데이터 ====================================================
train_data_path: ./data/titanic/train.parquet
test_data_path:  ./data/titanic/test.parquet
target_column:   survived

features_csv:    ./examples/titanic/features.csv

id_columns:
  - passenger_id

# ==== 산출물 ====================================================
artifact_dir: ./artifacts/titanic/models

# ==== 전처리 (1) 결측 → (2) 이상치 → (3) 스케일링 ================
preprocessing:
  numeric_null_strategy: median
  numeric_null_fill_value: 0.0
  categorical_null_strategy: most_frequent
  categorical_null_fill_value: MISSING
  outlier_method: percentile
  outlier_lower_quantile: 0.01
  outlier_upper_quantile: 0.99
  outlier_action: clip
  skew_method: signed_log1p
  skew_threshold: 1.0
  scaling_method: standard

# ==== 변수 선택 (Stability Selection) ============================
# 전처리 직후, 모델 학습 직전 단계. enabled=false 면 통째로 건너뛴다.
feature_selection:
  enabled: true                           # opt-in. 운영 안정화를 위해 기본 false.
  base_estimator: lasso                     # lasso (L1 logistic) | lgbm (gain top-K)
  n_subsamples: 50                          # 소규모 데이터(891 rows) 에 맞춰 축소
  subsample_ratio: 0.7                      # 작은 데이터이므로 비율을 높여 안정성 확보
  threshold: 0.6                            # 채택 임계값 (보통 0.6~0.8)
  random_state: 42
  min_selected: 1                           # 임계값 이상 변수가 부족할 때 fallback 최소 개수
  # lasso 전용
  lasso_C: 0.1
  # lgbm 전용
  lgbm_top_k: 10                            # 전체 피처 수(7개)에 맞춰 축소
  lgbm_n_estimators: 100
  lgbm_learning_rate: 0.1

# ==== 학습 ======================================================
training:
  cv_folds: 3
  random_state: 42
  early_stopping_rounds: 30
  primary_metric: roc_auc

# ==== 베이지안 하이퍼파라미터 최적화 ============================
tuning:
  enabled: true
  n_trials: 10        # 테스트용 — 운영에서는 30+ 권장
  timeout: null
  cv_folds: 3
  random_state: 42

# ==== 모델 ======================================================
models:
  lgbm:
    enabled: true
    fixed_params:
      objective: binary
      metric: auc
      verbose: -1
      n_estimators: 500
    search_space:
      learning_rate: { type: float, low: 0.01, high: 0.3, log: true }
      num_leaves:    { type: int,   low: 7,    high: 63 }
      max_depth:     { type: int,   low: 3,    high: 8 }
      min_data_in_leaf: { type: int, low: 5,   high: 50 }
      feature_fraction: { type: float, low: 0.6, high: 1.0 }
      bagging_fraction: { type: float, low: 0.6, high: 1.0 }

  xgb:
    enabled: true
    fixed_params:
      objective: binary:logistic
      eval_metric: auc
      tree_method: hist
      n_estimators: 500
    search_space:
      learning_rate:    { type: float, low: 0.01, high: 0.3, log: true }
      max_depth:        { type: int,   low: 3,    high: 8 }
      subsample:        { type: float, low: 0.6,  high: 1.0 }
      colsample_bytree: { type: float, low: 0.6,  high: 1.0 }
      min_child_weight: { type: float, low: 1.0,  high: 10.0 }

  catboost:
    enabled: true
    fixed_params:
      loss_function: Logloss
      eval_metric: AUC
      iterations: 500
      verbose: false
      allow_writing_files: false
    search_space:
      learning_rate: { type: float, low: 0.01, high: 0.3, log: true }
      depth:         { type: int,   low: 4,    high: 8 }
      l2_leaf_reg:   { type: float, low: 1.0,  high: 10.0 }

# ==== 리포트 (PDF 는 시스템 의존성 회피 위해 비활성) ============
reporting:
  output_dir: ./artifacts/titanic/reports
  generate_html: true
  generate_pdf: false
  title: Titanic Auto-ML Report

# ==== 스코어링 ==================================================
scoring:
  input_path:  ./data/titanic/score_input.parquet
  output_path: ./artifacts/titanic/scores/scores.parquet
  id_columns:
    - passenger_id
  threshold: 0.5

# ==== 작업 로그 =================================================
logging:
  log_dir: ./artifacts/titanic/logs
  level: INFO
  to_stdout: true
  to_file: true
