# 실행 샘플 설정 — python examples/sample/run_sample.py 가 사용한다.
# - 수 분 이내에 끝나도록 데이터·튜닝 규모를 작게 잡았다.
# - 경로는 저장소 루트 기준 상대 경로 (run_sample.py 가 루트에서 실행한다).
# - 운영 설정의 전체 옵션은 configs/example.yaml, USER_GUIDE.md Part II 참고.

# ==== 데이터 ====================================================
train_data_path: ./examples/sample/data/train.parquet
test_data_path:  ./examples/sample/data/test.parquet
target_column:   target
features_csv:    ./examples/sample/features.csv
id_columns:
  - customer_id

# ==== 산출물 ====================================================
# 단계 간 중간 산출물은 ./artifacts/sample/work/{train,inference} 에 저장된다.
artifact_dir: ./artifacts/sample/models

# ==== 전처리 ====================================================
preprocessing:
  numeric_null_strategy: median
  categorical_null_strategy: most_frequent
  outlier_method: percentile
  outlier_lower_quantile: 0.01
  outlier_upper_quantile: 0.99
  outlier_action: clip
  skew_method: signed_log1p        # amount 컬럼(오른쪽 꼬리) 이 자동 변환된다
  skew_threshold: 1.0
  scaling_method: standard

# ==== 변수 선택 =================================================
feature_selection:
  enabled: true
  base_estimator: lasso
  n_subsamples: 30
  threshold: 0.6
  min_selected: 3
  random_state: 42

# ==== 학습 / 튜닝 ===============================================
training:
  cv_folds: 3
  random_state: 42
  early_stopping_rounds: 30
  primary_metric: roc_auc

tuning:
  enabled: true
  n_trials: 5
  cv_folds: 2
  random_state: 42

# ==== 모델 ======================================================
models:
  lgbm:
    enabled: true
    fixed_params: { objective: binary, verbose: -1, n_estimators: 300 }
    search_space:
      learning_rate: { type: float, low: 0.02, high: 0.2, log: true }
      num_leaves:    { type: int,   low: 15,   high: 63 }
  xgb:
    enabled: true
    fixed_params: { objective: "binary:logistic", tree_method: hist, n_estimators: 300 }
    search_space:
      learning_rate: { type: float, low: 0.02, high: 0.2, log: true }
      max_depth:     { type: int,   low: 3,    high: 6 }
  catboost:
    enabled: false
  elasticnet:
    enabled: true
    fixed_params: { max_iter: 1000 }
    search_space:
      C:        { type: float, low: 1.0e-2, high: 10.0, log: true }
      l1_ratio: { type: float, low: 0.0,    high: 1.0 }

ensemble:
  enabled: true
  strategy: elasticnet_plus_best

# ==== 리포트 ====================================================
# PDF 는 WeasyPrint 시스템 라이브러리가 필요해 샘플에서는 끈다.
reporting:
  output_dir: ./artifacts/sample/reports
  generate_html: true
  generate_pdf: false
  title: Auto-ML Sample Report

# ==== 추론 ======================================================
scoring:
  input_path:  ./examples/sample/data/score_input.parquet
  output_path: ./artifacts/sample/scores/scores.parquet
  threshold: 0.5

# ==== 로그 ======================================================
logging:
  log_dir: ./artifacts/sample/logs
  level: INFO
  to_stdout: true
  to_file: true
