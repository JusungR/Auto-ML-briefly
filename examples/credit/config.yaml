# UCI Default of Credit Card Clients (이진분류: default) 학습/스코어링 설정.
# - python examples/credit/prepare_data.py 로 데이터 생성 후 실행
# - 30k 행이라 Titanic 보다 cv_folds / n_trials 를 약간 늘렸다.

# ==== 데이터 ====================================================
train_data_path: ./examples/credit/data/train.parquet
test_data_path:  ./examples/credit/data/test.parquet
target_column:   default

features_csv:    ./examples/credit/features.csv

id_columns:
  - client_id

# ==== 산출물 ====================================================
artifact_dir: ./artifacts/credit/models

# ==== 전처리 (1) 결측 → (2) 이상치 → (2.5) skew → (3) 스케일링 ====
preprocessing:
  numeric_null_strategy: median
  numeric_null_fill_value: 0.0
  categorical_null_strategy: most_frequent
  categorical_null_fill_value: MISSING
  outlier_method: percentile
  outlier_lower_quantile: 0.01
  outlier_upper_quantile: 0.99
  outlier_action: clip
  skew_method: signed_log1p          # BILL_AMT/PAY_AMT 군이 |skew|>>1 → 자동 변환
  skew_threshold: 1.0
  scaling_method: standard

# ==== 변수 선택 (Stability Selection) ============================
feature_selection:
  enabled: true
  base_estimator: lasso
  n_subsamples: 80
  subsample_ratio: 0.5
  threshold: 0.6
  random_state: 42
  min_selected: 3
  lasso_C: 0.1
  lgbm_top_k: 15
  lgbm_n_estimators: 100
  lgbm_learning_rate: 0.1

# ==== 학습 ======================================================
training:
  cv_folds: 4
  random_state: 42
  early_stopping_rounds: 50
  primary_metric: roc_auc

# ==== 베이지안 하이퍼파라미터 최적화 ============================
tuning:
  enabled: true
  n_trials: 15
  timeout: null
  cv_folds: 3
  random_state: 42

# ==== 모델 ======================================================
models:
  lgbm:
    enabled: true
    fixed_params:
      objective: binary
      metric: auc
      verbose: -1
      n_estimators: 800
    search_space:
      learning_rate: { type: float, low: 0.01, high: 0.3, log: true }
      num_leaves:    { type: int,   low: 15,   high: 127 }
      min_data_in_leaf: { type: int, low: 10,  high: 100 }
      feature_fraction: { type: float, low: 0.6, high: 1.0 }
      bagging_fraction: { type: float, low: 0.6, high: 1.0 }
      # 가중치 정규화 (과적합 완화)
      reg_alpha:         { type: float, low: 1.0e-8, high: 10.0, log: true }   # L1
      reg_lambda:        { type: float, low: 1.0e-8, high: 10.0, log: true }   # L2
      # 분할 보수성
      min_gain_to_split: { type: float, low: 0.0,    high: 0.5 }

  xgb:
    enabled: true
    fixed_params:
      objective: binary:logistic
      eval_metric: auc
      tree_method: hist
      n_estimators: 800
    search_space:
      learning_rate:    { type: float, low: 0.01, high: 0.3, log: true }
      max_depth:        { type: int,   low: 3,    high: 10 }
      subsample:        { type: float, low: 0.6,  high: 1.0 }
      colsample_bytree: { type: float, low: 0.6,  high: 1.0 }
      min_child_weight: { type: float, low: 1.0,  high: 10.0 }
      # 가중치 정규화
      reg_alpha:        { type: float, low: 1.0e-8, high: 10.0, log: true }    # L1
      reg_lambda:       { type: float, low: 1.0e-8, high: 10.0, log: true }    # L2
      # 분할 이득 최소 임계값 (LGBM 의 min_gain_to_split 과 동일 개념)
      gamma:            { type: float, low: 0.0,    high: 5.0 }

  catboost:
    enabled: true
    fixed_params:
      loss_function: Logloss
      eval_metric: AUC
      iterations: 800
      verbose: false
      allow_writing_files: false
    search_space:
      learning_rate: { type: float, low: 0.01, high: 0.3, log: true }
      depth:         { type: int,   low: 4,    high: 8 }
      # CatBoost 는 L1 미지원 — L2 를 log scale 로 더 강한 규제까지 시도
      l2_leaf_reg:         { type: float, low: 1.0, high: 100.0, log: true }
      # 노이즈 주입 (정규화 효과)
      random_strength:     { type: float, low: 0.0, high: 10.0 }
      bagging_temperature: { type: float, low: 0.0, high: 1.0 }

# ==== 리포트 (PDF 까지 생성) ====================================
reporting:
  output_dir: ./artifacts/credit/reports
  generate_html: true
  generate_pdf: true
  title: Credit Card Default Auto-ML Report

# ==== 스코어링 ==================================================
scoring:
  input_path:  ./examples/credit/data/score_input.parquet
  output_path: ./artifacts/credit/scores/scores.parquet
  id_columns:
    - client_id
  threshold: 0.5

# ==== 작업 로그 =================================================
logging:
  log_dir: ./artifacts/credit/logs
  level: INFO
  to_stdout: true
  to_file: true
